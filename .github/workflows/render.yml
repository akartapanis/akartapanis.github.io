name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render site
        run: node scripts/render-site.mjs

      # Publish only the built site. Source fragments (content/, data/,
      # templates/), scripts, and the old copies in uploads/ would otherwise
      # be served publicly and crawled as duplicate or thin pages.
      - name: Stage published files
        run: |
          mkdir _site
          tar -cf - \
            --exclude='./.git' --exclude='./.github' --exclude='./.idea' \
            --exclude='./uploads' --exclude='./content' --exclude='./data' \
            --exclude='./templates' --exclude='./scripts' \
            --exclude='./README.md' --exclude='./_site' \
            . | tar -xf - -C _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
