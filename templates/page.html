<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1BQPP7PEBK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-1BQPP7PEBK');
  </script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="{{canonicalUrl}}" />
  <link rel="icon" href="{{favicon}}" type="image/svg+xml" />
  <link rel="stylesheet" href="{{stylesheet}}" />

  <!-- OpenGraph (Facebook, LinkedIn, iMessage, Slack, Discord, etc.) -->
  <meta property="og:type" content="profile" />
  <meta property="og:site_name" content="{{brand}}" />
  <meta property="og:title" content="{{pageTitle}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{canonicalUrl}}" />
  <meta property="og:image" content="{{ogImageUrl}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{brand}} — {{description}}" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{pageTitle}}" />
  <meta name="twitter:description" content="{{description}}" />
  <meta name="twitter:image" content="{{ogImageUrl}}" />
</head>
<body>
  <header class="site-header" id="top">
    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="{{home}}" aria-label="{{brand}} home">
        <span class="brand-mark">{{brandMark}}</span>
        <span>{{brand}}</span>
      </a>
      <div class="nav-links">
{{nav}}
      </div>
    </nav>
  </header>

  <main>
{{main}}
  </main>

  <footer class="footer section-shell">
    <p>© {{brand}}</p>
    <a href="#top">Back to top ↑</a>
  </footer>
</body>
</html>
